# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Two independent jobs. GitHub Actions runs jobs in parallel by default; add
# `needs: <job-id>` to a job to make it wait for another one.
jobs:
  build-apiservice:
    name: Build ApiService
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore GoalGetter/GoalGetter.ApiService/GoalGetter.ApiService.csproj
    - name: Build
      run: dotnet build GoalGetter/GoalGetter.ApiService/GoalGetter.ApiService.csproj --no-restore

  build-webfrontend:
    name: Build WebFrontend
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore GoalGetter/GoalGetter.Web/GoalGetter.Web.csproj
    - name: Build
      run: dotnet build GoalGetter/GoalGetter.Web/GoalGetter.Web.csproj --no-restore
